# Bid intake — the single source of company facts for a government RFP response.
#
# Rules (they are the whole point of this file):
#   * `null` means "not known". Never guess. Builders turn null into a yellow
#     [[FILL: ...]] token in the document, and the readiness report lists it.
#   * Every non-null scalar that matters should carry a provenance entry in
#     `_provenance` (source + date) so a reviewer can see where it came from.
#   * Lists are lists of mappings; an empty list means "none known", not "none exist".
#   * Attestations (debarment, boycott certifications, Section 3 status, MBE/WBE
#     status) are the SIGNER's to make. A finder may record what a document says;
#     it must not decide them. Leave `attest: null` unless a signed source says so.
#
# Keys are referenced in drafts as {{firm.legal_name}}.

firm:
  legal_name: null            # exactly as on the SOS/IRS record — forms are rejected on mismatch
  trade_name: null            # dba, if any
  name_variants_seen: []      # every spelling found in sources (flag conflicts; do not pick one)
  entity_type: null           # LLC / corporation / sole proprietorship / partnership
  tax_classification: null    # partnership, S corp, C corp, disregarded
  state_of_formation: null
  sos_file_number: null
  ein: null                   # Profile of Firm "Tax ID Number"
  sam_uei: null               # only if registered in SAM.gov
  street_address: null
  city_state_zip: null
  phone: null
  fax: null
  email: null
  website: null
  year_established: null
  year_established_dfw: null
  former_names: []
  parent_company: null        # name + acquisition date, or null
  service_area: null          # e.g. counties served

principals:                   # Profile of Firm table; ownership must total 100
  - name: null
    title: null
    ownership_pct: null

signatory:
  name: null
  title: null
  authority_evidence: null    # e.g. "Managing member; operating agreement §x" — HUD-5369-B 1(b)
  notary_available: null

key_personnel:                # project manager + supervisors named on Profile of Firm
  - name: null
    title: null
    role_on_contract: null
    years_experience: null
    certifications: []        # RRP renovator, OSHA 10/30, trade licences ...

status_claims:                # facts on file, NOT attestations
  mbe: {claimed: null, group: null, certificate: null}
  wbe: {claimed: null, certificate: null}
  hub: {claimed: null, certificate: null}
  section3_business: {claimed: null, basis: null, dha_certificate: null}
  certifications: []          # issuer, number, expiry
  debarment: {ever_debarred: null, explanation: null, sam_exclusion_check_date: null}

insurance:
  broker: {name: null, phone: null, email: null}
  cgl:    {carrier: null, am_best: null, each_occurrence: null, aggregate: null, form: null, occurrence_basis: null, policy_no: null, expires: null, naic: null}
  wc:     {carrier: null, am_best: null, statutory: null, el_each_accident: null, el_disease_policy: null, el_disease_employee: null, policy_no: null, expires: null}
  auto:   {carrier: null, csl_each_accident: null, any_auto_symbol1: null, policy_no: null, expires: null}
  umbrella: {carrier: null, limit: null, expires: null}
  professional: {carrier: null, per_claim: null, aggregate: null, expires: null, applies_to_make_ready: null}
  endorsements_available: {additional_insured: null, waiver_of_subrogation: null, primary_noncontributory: null, thirty_day_notice_of_cancellation: null}

licenses:                     # trade licences actually held, by holder
  - type: null                # e.g. TDLR master electrician, TSBPE master plumber, EPA RRP firm cert
    number: null
    holder: null              # company or named individual
    expires: null

experience:
  years_make_ready_commercial: null
  years_make_ready_residential: null
  years_in_business_total: null
  projects:                   # past performance that can be shown to the committee
    - client: null
      location: null
      dates: null
      scope: null
      units_or_area: null
      contract_value: null
      client_contact: null
      client_phone: null
  ha_or_government_experience: []   # housing authority / federal / state / local work, each a mapping like projects

references:                   # RFP requires a minimum of five
  - company: null
    address: null
    city_state_zip: null
    contact: null
    phone: null

workforce:                    # Section 3 certification table; counts of CURRENT employees
  full_time_employees: null
  by_category: []             # [{category, total, male:{white,black,hispanic,asian_pi,native}, female:{...}}]
  hiring_screening: {background_check: null, drug_screen: null, e_verify: null, vendor: null, other: null}
  staffing_model: null        # how staff are assigned to properties
  current_openings: null

subcontractors:               # by trade, used regularly
  - trade: null
    firm: null
    licence: null
    years_working_together: null
    mbe_wbe_section3: null

capacity:
  crews_available: null
  max_units_in_progress: null
  vehicles: null
  equipment: null
  response_time_hours: null   # what the firm can truthfully commit to for the 24h-start rule
  backlog_note: null

qc_tools:                     # what is IN USE TODAY — the evaluators score "how the contractor utilizes"
  time_tracking: {tool: null, in_use_today: null}
  photo_documentation: {tool: null, in_use_today: null}
  qa_checklists: {tool: null, in_use_today: null}
  sample_forms_from_prior_work: []   # files that exist, not templates

financial:
  bank_reference: null
  line_of_credit: null
  bonding: {surety: null, single_limit: null, aggregate_limit: null}
  annual_revenue_band: null
  litigation_or_liens_disclosure: null

tx_certifications:            # signer's answers; record only what a signed document states
  employee_count_ge_10: null
  israel_boycott_2271: {answer: null, signed_source: null}
  energy_boycott_2274: {answer: null, signed_source: null}
  firearm_discrimination_2274: {answer: null, signed_source: null}
  ciq_conflicts_to_disclose: null

pricing_inputs:               # used only by the pricing workbook; never invent
  burdened_labor_rates: {cleaner: null, painter: null, drywall: null, carpenter: null, electrician: null, plumber: null, flooring: null, general_laborer: null}
  overhead_pct: null
  profit_pct: null
  sales_tax_rate_on_materials: null
  dha_furnishes_paint: null   # from DHA's RFI answer
  travel_or_mobilization_policy: null

_provenance: {}               # key -> {source, date, confidence}
