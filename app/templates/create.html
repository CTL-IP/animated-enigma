{% extends "base.html" %}
{% block title %}New ad — ContractorAds{% endblock %}
{% block content %}
<h1 class="text-3xl font-semibold tracking-tight">New ad</h1>
<p class="mt-1 mb-6 text-stone-600">Save the business details first. Copy is generated on the next screen.</p>
<form method="post" action="/ads/new" enctype="multipart/form-data" class="max-w-2xl space-y-4 rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
  {% include "fields.html" %}
  <button type="submit" class="rounded bg-brand px-4 py-2 font-semibold text-white hover:bg-brand-dark">Save draft</button>
</form>
{% endblock %}
