{% extends "base.html" %}
{% block title %}Choose a Page — ContractorAds{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-gray-900">Which Page should get the ads?</h1>
  <p class="text-gray-500 mt-2">Only the Page you pick can be posted to from this machine.</p>
  <div class="mt-6 space-y-3">
    {% for page in pages %}
    <form method="POST" action="/facebook/select">
      <input type="hidden" name="page_id" value="{{ page.page_id }}" />
      <button type="submit" class="w-full text-left bg-white border border-gray-200 hover:border-orange-400 rounded-xl px-4 py-3 font-semibold text-gray-900">
        {{ page.page_name }}
      </button>
    </form>
    {% endfor %}
  </div>
</div>
{% endblock %}
